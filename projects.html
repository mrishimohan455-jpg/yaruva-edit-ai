<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f0e7">
  <title>YARUVA — Projects</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app-shell">

  <header class="topbar">

    <button
      class="icon-btn"
      onclick="location.href='index.html'">
      ←
    </button>

    <div class="brand">
      <span class="brand-mark">Y</span>
      <span>YARUVA</span>
    </div>

    <button
      class="icon-btn"
      onclick="location.href='editor.html'">
      +
    </button>

  </header>


  <main class="projects-page">

    <section class="projects-heading">

      <div class="eyebrow">YOUR CREATIVE SPACE</div>

      <h1>
        Your<br>
        <span>projects.</span>
      </h1>

      <p>
        Everything you've created with YARUVA,
        in one place.
      </p>

    </section>


    <section>

      <div class="section-head">
        <h2>Creations</h2>
        <span id="projectCount">0 projects</span>
      </div>

      <div
        class="projects-grid"
        id="projectsGrid">
      </div>

      <div
        class="projects-empty"
        id="projectsEmpty">

        <div class="empty-project-icon">
          ✦
        </div>

        <h2>No creations yet</h2>

        <p>
          Your AI creations will appear here
          after you save them.
        </p>

        <button
          class="primary"
          onclick="location.href='editor.html'">
          Create your first project →
        </button>

      </div>

    </section>

  </main>


  <nav class="bottom-nav">

    <button onclick="location.href='index.html'">
      ⌂
      <span>Home</span>
    </button>

    <button onclick="location.href='editor.html'">
      ✦
      <span>Create</span>
    </button>

    <button class="active">
      ▣
      <span>Projects</span>
    </button>

    <button id="profileNav">
      ◉
      <span>Profile</span>
    </button>

  </nav>

</div>


<script>

const grid =
  document.getElementById("projectsGrid");

const empty =
  document.getElementById("projectsEmpty");

const count =
  document.getElementById("projectCount");

const projects =
  JSON.parse(
    localStorage.getItem("yaruvaProjects") || "[]"
  );


function renderProjects() {

  count.textContent =
    `${projects.length} ${
      projects.length === 1
        ? "project"
        : "projects"
    }`;

  if (!projects.length) {

    empty.style.display = "grid";
    grid.innerHTML = "";

    return;
  }

  empty.style.display = "none";

  grid.innerHTML =
    projects.map(project => {

      const date =
        project.createdAt
          ? new Date(project.createdAt)
              .toLocaleDateString(
                undefined,
                {
                  day: "numeric",
                  month: "short"
                }
              )
          : "";

      return `

        <article class="project-card">

          <div class="project-image">

            <img
              src="${project.image}"
              alt="YARUVA project">

          </div>

          <div class="project-details">

            <strong>
              ${escapeHTML(
                project.title ||
                "YARUVA Creation"
              )}
            </strong>

            <small>
              ${date}
            </small>

          </div>

          <button
            class="delete-project"
            data-id="${project.id}"
            aria-label="Delete project">
            ×
          </button>

        </article>

      `;

    }).join("");

  document
    .querySelectorAll(".delete-project")
    .forEach(button => {

      button.addEventListener(
        "click",
        deleteProject
      );

    });
}


function deleteProject(event) {

  const id =
    Number(event.currentTarget.dataset.id);

  const index =
    projects.findIndex(
      project => project.id === id
    );

  if (index === -1) return;

  if (
    !confirm(
      "Delete this YARUVA project?"
    )
  ) return;

  projects.splice(index, 1);

  localStorage.setItem(
    "yaruvaProjects",
    JSON.stringify(projects)
  );

  renderProjects();
}


function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


document
  .getElementById("profileNav")
  ?.addEventListener(
    "click",
    () => {
      alert(
        "YARUVA profile — coming soon."
      );
    }
  );


renderProjects();

</script>

</body>
</html>
