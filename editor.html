<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>YARUVA Editor</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
background:#08080a;
color:#f5f5f7;
min-height:100vh;
-webkit-font-smoothing:antialiased;
}

button,input{font:inherit}

.app{
max-width:600px;
margin:auto;
padding:20px 16px 110px;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:22px;
}

.back{
border:1px solid #29292e;
background:#121216;
color:#eee;
width:42px;
height:42px;
border-radius:14px;
font-size:22px;
}

.title{
text-align:center;
}

.title strong{
display:block;
font-size:16px;
}

.title span{
font-size:11px;
color:#777780;
}

.save{
border:0;
background:none;
color:#a78bfa;
font-size:12px;
font-weight:700;
}

.video-box{
position:relative;
width:100%;
aspect-ratio:9/16;
max-height:520px;
background:#111114;
border:1px solid #29292e;
border-radius:22px;
overflow:hidden;
display:grid;
place-items:center;
}

video{
width:100%;
height:100%;
object-fit:contain;
display:none;
background:#050506;
}

.empty{
text-align:center;
padding:30px;
}

.empty-icon{
font-size:42px;
margin-bottom:16px;
}

.empty h1{
font-size:22px;
margin-bottom:8px;
}

.empty p{
color:#777780;
font-size:13px;
line-height:1.5;
margin-bottom:22px;
}

.upload{
display:inline-flex;
align-items:center;
justify-content:center;
background:#f5f5f7;
color:#09090b;
padding:14px 20px;
border-radius:14px;
font-weight:750;
font-size:14px;
cursor:pointer;
}

input[type=file]{display:none}

.controls{
display:none;
margin-top:18px;
}

.time{
display:flex;
justify-content:space-between;
color:#85858e;
font-size:11px;
margin-bottom:8px;
}

.timeline{
position:relative;
height:52px;
background:#151519;
border:1px solid #29292e;
border-radius:14px;
padding:15px 10px;
}

.timeline-line{
height:22px;
border-radius:6px;
background:
linear-gradient(90deg,#28282e 0 8%,#3b3b45 8% 12%,#28282e 12% 20%,#3b3b45 20% 25%,#28282e 25% 33%,#3b3b45 33% 38%,#28282e 38% 48%,#3b3b45 48% 53%,#28282e 53% 62%,#3b3b45 62% 68%,#28282e 68% 78%,#3b3b45 78% 83%,#28282e 83% 92%,#3b3b45 92% 96%,#28282e 96%);
}

.range{
width:100%;
margin-top:-12px;
position:relative;
z-index:2;
accent-color:#a78bfa;
}

.play-row{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin:16px 0;
}

.play{
width:52px;
height:52px;
border-radius:50%;
border:0;
background:#f5f5f7;
color:#09090b;
font-size:20px;
}

.small-btn{
width:42px;
height:42px;
border-radius:13px;
border:1px solid #29292e;
background:#121216;
color:#ddd;
}

.tool-section{
margin-top:24px;
}

.section-title{
font-size:12px;
text-transform:uppercase;
letter-spacing:.12em;
color:#777780;
margin-bottom:11px;
}

.tools{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.tool{
border:1px solid #29292e;
background:#111114;
border-radius:15px;
padding:13px 5px;
color:#eee;
text-align:center;
}

.tool-icon{
font-size:19px;
display:block;
margin-bottom:7px;
}

.tool span{
font-size:10px;
color:#92929b;
}

.setting{
background:#111114;
border:1px solid #29292e;
border-radius:17px;
padding:15px;
margin-top:10px;
}

.setting-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.setting-label strong{
display:block;
font-size:13px;
}

.setting-label span{
display:block;
color:#777780;
font-size:11px;
margin-top:4px;
}

input[type=range]{
width:140px;
accent-color:#a78bfa;
}

.bottom{
position:fixed;
bottom:13px;
left:50%;
transform:translateX(-50%);
width:min(570px,calc(100% - 28px));
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding:7px;
background:rgba(18,18,22,.95);
backdrop-filter:blur(18px);
border:1px solid #29292e;
border-radius:20px;
}

.bottom button{
height:48px;
border-radius:14px;
border:1px solid #29292e;
background:#141418;
color:#eee;
font-weight:700;
font-size:12px;
}

.bottom .export{
background:#f5f5f7;
color:#09090b;
}

.toast{
position:fixed;
left:50%;
bottom:80px;
transform:translate(-50%,10px);
background:#f5f5f7;
color:#111;
padding:11px 15px;
border-radius:13px;
font-size:12px;
font-weight:700;
opacity:0;
transition:.2s;
z-index:10;
white-space:nowrap;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

@media(max-width:360px){
.tools{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<main class="app">

<header class="top">
<button class="back" onclick="history.back()">‹</button>

<div class="title">
<strong>YARUVA EDITOR</strong>
<span>Project workspace</span>
</div>

<button class="save" onclick="show('Project saved locally')">Save</button>
</header>

<section class="video-box">

<div class="empty" id="empty">

<div class="empty-icon">🎬</div>

<h1>Start your project</h1>

<p>
Choose a video from your device and begin
editing with YARUVA.
</p>

<label class="upload">
＋ Choose video
<input id="file" type="file" accept="video/*">
</label>

</div>

<video id="video" playsinline></video>

</section>

<section class="controls" id="controls">

<div class="time">
<span id="current">00:00</span>
<span id="duration">00:00</span>
</div>

<div class="timeline">
<div class="timeline-line"></div>
<input class="range" id="seek" type="range" min="0" max="100" value="0">
</div>

<div class="play-row">

<button class="small-btn" onclick="video.currentTime=startTime">↶</button>

<button class="play" id="play">▶</button>

<button class="small-btn" onclick="video.currentTime=endTime">↷</button>

</div>

<div class="tool-section">

<div class="section-title">Quick tools</div>

<div class="tools">

<button class="tool" onclick="show('✂️ Trim mode selected')">
<span class="tool-icon">✂️</span>
<span>Trim</span>
</button>

<button class="tool" onclick="show('🎵 Music tool coming next')">
<span class="tool-icon">🎵</span>
<span>Music</span>
</button>

<button class="tool" onclick="show('📝 Text tool coming next')">
<span class="tool-icon">📝</span>
<span>Text</span>
</button>

<button class="tool" onclick="show('🎨 Colour controls coming next')">
<span class="tool-icon">🎨</span>
<span>Colour</span>
</button>

</div>

</div>

<div class="tool-section">

<div class="section-title">Adjust</div>

<div class="setting">

<div class="setting-row">

<div class="setting-label">
<strong>🔊 Volume</strong>
<span>Adjust project audio</span>
</div>

<input id="volume" type="range" min="0" max="1" step=".05" value="1">

</div>

</div>

<div class="setting">

<div class="setting-row">

<div class="setting-label">
<strong>⚡ Speed</strong>
<span>Change playback speed</span>
</div>

<select id="speed" style="background:#18181c;color:#eee;border:1px solid #29292e;border-radius:10px;padding:8px">
<option value=".5">0.5×</option>
<option value=".75">0.75×</option>
<option value="1" selected>1×</option>
<option value="1.25">1.25×</option>
<option value="1.5">1.5×</option>
<option value="2">2×</option>
</select>

</div>

</div>

</div>

</section>

</main>

<nav class="bottom">

<button onclick="show('✨ AI editing assistant coming next')">
✨ AI Assistant
</button>

<button class="export" onclick="show('Export engine is our next upgrade 🚀')">
Export video
</button>

</nav>

<div class="toast" id="toast"></div>

<script>

const file=document.getElementById("file");
const video=document.getElementById("video");
const empty=document.getElementById("empty");
const controls=document.getElementById("controls");
const play=document.getElementById("play");
const seek=document.getElementById("seek");
const volume=document.getElementById("volume");
const speed=document.getElementById("speed");

let startTime=0;
let endTime=0;

file.addEventListener("change",function(){

const selected=this.files[0];

if(!selected)return;

const url=URL.createObjectURL(selected);

video.src=url;
video.style.display="block";
empty.style.display="none";
controls.style.display="block";

video.load();

show("🎬 Video loaded — let's edit");

});

video.addEventListener("loadedmetadata",function(){

endTime=video.duration;

seek.max=video.duration;
seek.value=0;

document.getElementById("duration").textContent=format(video.duration);

});

video.addEventListener("timeupdate",function(){

seek.value=video.currentTime;

document.getElementById("current").textContent=format(video.currentTime);

if(endTime && video.currentTime>=endTime){

video.pause();
video.currentTime=startTime;

}

});

play.addEventListener("click",function(){

if(video.paused){

video.play();
play.textContent="Ⅱ";

}else{

video.pause();
play.textContent="▶";

}

});

seek.addEventListener("input",function(){

video.currentTime=Number(this.value);

});

volume.addEventListener("input",function(){

video.volume=this.value;

});

speed.addEventListener("change",function(){

video.playbackRate=this.value;

});

function format(seconds){

if(!isFinite(seconds))return"00:00";

const m=Math.floor(seconds/60);
const s=Math.floor(seconds%60);

return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

}

let timer;

function show(text){

const toast=document.getElementById("toast");

toast.textContent=text;
toast.classList.add("show");

clearTimeout(timer);

timer=setTimeout(()=>{
toast.classList.remove("show");
},2200);

}

</script>

</body>
</html>
