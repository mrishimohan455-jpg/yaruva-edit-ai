<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e8">
  <title>YARUVA — AI Creative Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Y</span>
      <span>YARUVA</span>
    </div>

    <button class="icon-btn" id="profileBtn" aria-label="Profile">
      ◉
    </button>
  </header>

  <main class="home">

    <!-- HERO -->
    <section class="hero">
      <div class="eyebrow">AI CREATIVE STUDIO</div>

      <h1>
        Make it
        <br>
        <span>unforgettable.</span>
      </h1>

      <p>
        Turn one idea into a polished image,
        cinematic video or visual story.
      </p>

      <button
        class="primary"
        onclick="location.href='editor.html'">
        Start creating <b>→</b>
      </button>
    </section>


    <!-- AI TOOLS -->
    <section>

      <div class="section-head">
        <h2>What will you create?</h2>
        <span>4 tools</span>
      </div>

      <div class="tools-grid">

        <button
          class="tool-card"
          onclick="location.href='editor.html'">

          <i>✦</i>

          <strong>AI Edit</strong>

          <small>
            Tell YARUVA what to change
          </small>

        </button>


        <button
          class="tool-card"
          onclick="location.href='editor.html?mode=video'">

          <i>▶</i>

          <strong>Image → Video</strong>

          <small>
            Bring a still image to life
          </small>

        </button>


        <button
          class="tool-card"
          onclick="location.href='editor.html?mode=style'">

          <i>◈</i>

          <strong>AI Styles</strong>

          <small>
            Find your visual identity
          </small>

        </button>


        <button
          class="tool-card"
          onclick="location.href='editor.html?mode=remove'">

          <i>⌫</i>

          <strong>Remove</strong>

          <small>
            Clean anything in seconds
          </small>

        </button>

      </div>

    </section>


    <!-- QUICK START -->
    <section>

      <div class="section-head">
        <h2>Quick start</h2>
        <span>Prompt it</span>
      </div>

      <div class="prompt-card">

        <div class="prompt-icon">
          ✦
        </div>

        <div>
          <strong>Ask YARUVA AI</strong>

          <p>
            “Make this cinematic and premium…”
          </p>
        </div>

        <button onclick="location.href='editor.html'">
          →
        </button>

      </div>

    </section>


    <!-- RECENT PROJECTS -->
    <section class="recent">

      <div class="section-head">
        <h2>Recent projects</h2>

        <span onclick="location.href='projects.html'">
          View all
        </span>
      </div>

      <div class="empty">
        Your creations will appear here.
      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button class="active">
      ⌂
      <span>Home</span>
    </button>

    <button onclick="location.href='editor.html'">
      ✦
      <span>Create</span>
    </button>

    <button onclick="location.href='projects.html'">
      ▣
      <span>Projects</span>
    </button>

    <button id="profileNav">
      ◉
      <span>Profile</span>
    </button>

  </nav>

</div>


<script src="app.js"></script>

</body>
</html>
